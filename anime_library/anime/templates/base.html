<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Watch Note{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2 family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #d4a373;
            --gold-glow: rgba(212, 163, 115, 0.4);
            --glass-bg: rgba(15, 15, 15, 0.7); /* Точно такий же колір, як на головній */
            --border-gold: rgba(212, 163, 115, 0.1);
        }

        body {
            margin: 0;
            padding: 120px 20px 40px; /* Повернули рідний відступ головної сторінки */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            min-height: 100vh;
        }

        /* Твій фірмовий фон, що повернувся */
        body::before {
            content: "";
            position: fixed;
            top: 50px; left: 0; width: 100%; height: 100%;
            background-image: url('https://i.pinimg.com/736x/ac/3b/46/ac3b465eba3206321fa1a2dc49c08fff.jpg');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transform: rotate(270deg) scale(2.2);
            z-index: -1;
            pointer-events: none;
            filter: brightness(0.4) saturate(1.2);
        }

        .nav-menu {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(15px); /* Ті самі 15px розмиття */
            border-bottom: 1px solid var(--border-gold);
            z-index: 2000;
            display: flex;
            justify-content: center;
            padding: 20px 0; /* КОНКРЕТНО ЯК НА ГОЛОВНІЙ! */
        }

        .nav-list {
            display: flex;
            gap: 40px; /* Повний збіг по ширині проміжків */
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .nav-link {
            color: #f5f5dc;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 500;
            transition: 0.3s;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-link:hover {
            color: var(--accent-color);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent-color);
        }

        .search-input-wrapper {
            width: 0;
            overflow: hidden;
            opacity: 0;
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper.active {
            width: 220px;
            opacity: 1;
            margin-left: 10px;
        }

        .search-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            padding: 6px 15px;
            color: #f5f5dc;
            outline: none;
            width: 150px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <nav class="nav-menu">
        <ul class="nav-list">
            <li><a href="{% url 'anime:anime_list' %}" class="nav-link">Головна</a></li>
            <li><a href="{% url 'profiles:my_list' %}" class="nav-link">Мій список</a></li>

            <li style="display: flex; align-items: center;">
                <button id="search-trigger" class="nav-link">Пошук</button>
                <div id="search-wrapper" class="search-input-wrapper {% if request.GET.q %}active{% endif %}">
                    <form action="{% url 'anime:anime_list' %}" method="get">
                        <input type="text" name="q" value="{{ request.GET.q|default:'' }}" placeholder="Пошук..." class="search-input">
                    </form>
                </div>
            </li>

            {% if user.is_authenticated %}
                <a href="{% url 'profiles:profile_detail' user.profile.pk %}" class="nav-link">{{ user.profile.nickname|default:user.username|upper }}</a>
               <li>
    <form action="{% url 'logout' %}" method="post" style="display: inline; margin: 0; padding: 0;">
        {% csrf_token %}
        <button type="submit" class="nav-link" style="background: none; border: none; padding: 0; margin: 0; cursor: pointer; font-family: inherit;">
            Вийти
        </button>
    </form>
</li>

            {% else %}
                <li><a href="{% url 'login' %}" class="nav-link">Увійти</a></li>
            {% endif %}
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        const trigger = document.getElementById('search-trigger');
        const wrapper = document.getElementById('search-wrapper');
        const input = wrapper.querySelector('input');

        if (trigger && wrapper && input) {
            trigger.addEventListener('click', (e) => {
                e.preventDefault();
                wrapper.classList.toggle('active');

                if (wrapper.classList.contains('active')) {
                    input.focus();
                }
            });
        }
    </script>
</body>
</html>
