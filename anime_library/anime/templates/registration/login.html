<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід - Watch Note</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            color: #f5f5dc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }


        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.pinimg.com/736x/db/90/97/db9097ead8d89acb01d02744fa6d9350.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
            filter: brightness(0.4);
        }

        .login-card {
            background: rgba(245, 245, 220, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 163, 115, 0.4);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h2 {
            color: #d4a373;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9em;
            color: #e5e5e5;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(245, 245, 220, 0.3);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            outline: none;
            font-size: 1em;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #d4a373;
            box-shadow: 0 0 10px rgba(212, 163, 115, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #d4a373;
            color: white;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 15px rgba(212, 163, 115, 0.4);
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #f5f5dc;
            text-decoration: none;
            font-size: 0.85em;
            opacity: 0.7;
            transition: 0.3s;
        }

        .back-link:hover {
            opacity: 1;
            color: #d4a373;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Вхід</h2>
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Ім'я користувача</label>
                <input type="text" name="username" id="id_username" required>
            </div>

            <div class="form-group">
                <label for="id_password">Пароль</label>
                <input type="password" name="password" id="id_password" required>
            </div>

            <button type="submit" class="btn-login">Увійти</button>
        </form>

        <a href="{% url 'anime:anime_list' %}" class="back-link">← На головну</a>
    </div>

</body>
</html>
