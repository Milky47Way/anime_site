<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Пароль змінено</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #1a1a2e; color: #f5f5dc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://i.pinimg.com/1200x/e1/41/6c/e1416c604ed8c77a485a1b18b2f8d1fa.jpg');
            background-size: cover; background-position: center; z-index: -1;
            filter: brightness(0.35) saturate(1.1);
        }
        .login-card {
            background: rgba(245, 245, 220, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 163, 115, 0.4); border-radius: 20px; padding: 40px;
            width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h2 { color: #d4a373; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; }
        p { font-size: 0.95em; color: #e5e5e5; line-height: 1.6; text-align: left; }
        .btn-login {
            display: block; width: 100%; box-sizing: border-box; padding: 12px; background: #d4a373; color: white;
            border: none; border-radius: 15px; font-weight: bold; font-size: 1.1em; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; text-decoration: none;
        }
        .btn-login:hover { filter: brightness(1.1); box-shadow: 0 0 15px rgba(212, 163, 115, 0.4); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Шифр оновлено!</h2>
        <p>Пароль успішно перезаписаний. Тепер ви можете спокійно увійти під своїми новими даними.</p>
        <a href="{% url 'login' %}" class="btn-login">Увійти знову</a>
    </div>
</body>
</html>
