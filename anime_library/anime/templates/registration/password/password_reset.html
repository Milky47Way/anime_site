<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Відновлення пароля</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #1a1a2e; color: #f5f5dc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://i.pinimg.com/1200x/e1/41/6c/e1416c604ed8c77a485a1b18b2f8d1fa.jpg');
            background-size: cover; background-position: center; z-index: -1;
            filter: brightness(0.35) saturate(1.1);
        }
        .login-card {
            background: rgba(245, 245, 220, 0.15); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(212, 163, 115, 0.4); border-radius: 20px; padding: 40px;
            width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h2 { color: #d4a373; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; }
        p { font-size: 0.95em; color: #e5e5e5; line-height: 1.5; text-align: left; margin-bottom: 20px; }

        /* Стилізація полів Django форми */
        .login-card p input {
            width: 100%; box-sizing: border-box; padding: 12px 15px; border-radius: 12px;
            border: 1px solid rgba(245, 245, 220, 0.3); background: rgba(0, 0, 0, 0.4);
            color: #fff; outline: none; font-size: 1em; transition: 0.3s; margin-top: 5px;
        }
        .login-card p input:focus { border-color: #d4a373; box-shadow: 0 0 10px rgba(212, 163, 115, 0.3); background: rgba(0, 0, 0, 0.6); }
        .login-card p label { display: block; text-align: left; font-size: 0.9em; color: #e5e5e5; margin-bottom: 5px; }

        .btn-login {
            width: 100%; padding: 12px; background: #d4a373; color: white; border: none;
            border-radius: 15px; font-weight: bold; font-size: 1.1em; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 15px;
        }
        .btn-login:hover { filter: brightness(1.1); box-shadow: 0 0 15px rgba(212, 163, 115, 0.4); transform: translateY(-2px); }
        .back-link { display: inline-block; margin-top: 20px; color: #f5f5dc; text-decoration: none; font-size: 0.85em; opacity: 0.7; transition: 0.3s; }
        .back-link:hover { opacity: 1; color: #d4a373; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Скидання пароля</h2>
        <p>Забули ключ? Можемо зробити новий. Введіть свій Еmail, і я надішлю туди інструкції</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn-login">Надіслати лінк</button>
        </form>
        <a href="{% url 'login' %}" class="back-link">Повернутися до входу</a>
    </div>
</body>
</html>
