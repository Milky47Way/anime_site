<h1>Профіль: {{ user.username }}</h1>

<a href="{% url 'profile_settings' %}">⚙️ Налаштування</a>

<form method="post">
    {% csrf_token %}

    <table border="1">
        <tr>
            <th>Аніме</th>
            <th>Статус</th>
            <th>Рейтинг</th>
            <th>Серії</th>
            <th>Коментар</th>
        </tr>

        {% for item in anime_list %}
        <tr>
            <td>{{ item.anime.title }}</td>

            <td>
                <select name="status_{{ item.id }}">
                    {% for key, value in item.STATUS_CHOICES %}
                        <option value="{{ key }}" {% if item.status == key %}selected{% endif %}>
                            {{ value }}
                        </option>
                    {% endfor %}
                </select>
            </td>

            <td>⭐️ {{ item.rating|default:"-" }}</td>

            <td>
                <input type="number" name="episodes_{{ item.id }}" value="{{ item.episodes_watched }}">
            </td>

            <td>
                <input type="text" name="comment_{{ item.id }}" value="{{ item.comment }}">
            </td>
        </tr>
        {% endfor %}
    </table>

    <button type="submit">💾 Зберегти</button>
</form>
