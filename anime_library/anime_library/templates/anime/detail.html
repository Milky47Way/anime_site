<h1>{{ character.name }}</h1>

{% if character.photo %}
    <img src="{{ character.photo.url }}" width="200">
{% endif %}

<p><b>Вік:</b> {{ character.age }}</p>
<p><b>Роль:</b> {{ character.role }}</p>
<p><b>Опис:</b> {{ character.description }}</p>
<p><b>Сім'я:</b> {{ character.family }}</p>

<p><b>Аніме:</b> {{ character.anime.title }}</p>

<a href="{% url 'character_edit' character.id %}">✏️ Редагувати</a>
