<h1>⚙️ Налаштування профілю</h1>

<h2>Змінити дані</h2>
<form method="post">
    {% csrf_token %}
    {{ user_form.as_p }}

    <button type="submit">Зберегти</button>
</form>

<hr>

<h2>Змінити пароль</h2>
<form method="post">
    {% csrf_token %}
    {{ password_form.as_p }}

    <button type="submit">Змінити пароль</button>
</form>

<a href="{% url 'user:profile_detail' pk=user.profile.pk %}">⬅️ Назад</a>
